apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-lab-alert-pipeline-test
  labels:
    release: monitoring
spec:
  groups:
    - name: ai-lab.learning
      rules:
        - alert: AiLabAlertPipelineTest
          # Change to vector(1) while testing. An alert resolves only when the
          # expression returns an empty vector; a bare vector(0) still fires.
          expr: vector(0) == 1
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: AI Lab 告警链路测试
            description: PrometheusRule 到 Alertmanager 再到 Webhook 的端到端测试告警。
        - alert: PodCrashLooping
          expr: |
            max by (namespace, pod, container) (
              max_over_time(
                kube_pod_container_status_waiting_reason{
                  namespace="demo",
                  reason="CrashLoopBackOff"
                }[5m]
              )
            ) == 1
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: Demo Pod 持续崩溃
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} 的
              {{ $labels.container }} 容器处于 CrashLoopBackOff。
