apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-lab-alert-pipeline-test
  labels:
    release: monitoring
spec:
  groups:
    - name: ai-lab.learning
      rules:
        - alert: AiLabAlertPipelineTest
          # Change to vector(1) only while testing the alert pipeline.
          expr: vector(0)
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: AI Lab 告警链路测试
            description: PrometheusRule 到 Alertmanager 再到 Webhook 的端到端测试告警。
