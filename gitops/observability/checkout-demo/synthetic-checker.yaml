apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-synthetic-checker
  namespace: demo
  labels:
    app.kubernetes.io/name: checkout-synthetic-checker
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: synthetic-checker
    observability.ai-lab/service: checkout-demo
    observability.ai-lab/team: commerce
    observability.ai-lab/environment: lab
    observability.ai-lab/cluster: k3d-ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-synthetic-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-synthetic-checker
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: synthetic-checker
        observability.ai-lab/service: checkout-demo
        observability.ai-lab/team: commerce
        observability.ai-lab/environment: lab
        observability.ai-lab/cluster: k3d-ai-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: diagnostic-agent:dev
          imagePullPolicy: Never
          env:
            - name: TARGET_URL
              value: http://checkout-demo.demo.svc.cluster.local:8080/checkout
            - name: TARGET_SERVICE
              value: checkout-demo
            - name: ENVIRONMENT
              value: lab
            - name: CHECK_INTERVAL_SECONDS
              value: "5"
          command:
            - python
            - -c
          args:
            - |
              import json
              import os
              import threading
              import time
              import uuid
              from http.server import BaseHTTPRequestHandler, HTTPServer
              from urllib.error import HTTPError, URLError
              from urllib.request import Request, urlopen

              target_url = os.environ["TARGET_URL"]
              target_service = os.environ["TARGET_SERVICE"]
              environment = os.environ["ENVIRONMENT"]
              interval = float(os.environ["CHECK_INTERVAL_SECONDS"])
              state = {"requests": 0, "failures": 0, "success": 0, "latency_sum": 0.0}
              lock = threading.Lock()

              def log(event, **extra):
                  print(json.dumps({
                      "service": "checkout-synthetic-checker",
                      "target_service": target_service,
                      "environment": environment,
                      "event": event,
                      **extra,
                  }, ensure_ascii=False), flush=True)

              def run_check():
                  while True:
                      request_id = str(uuid.uuid4())
                      started = time.monotonic()
                      status = None
                      error = None
                      try:
                          request = Request(target_url, headers={"X-Synthetic-Check": "true"})
                          with urlopen(request, timeout=3) as response:
                              status = response.status
                              success = 200 <= status < 300
                      except HTTPError as exc:
                          status = exc.code
                          success = False
                          error = f"http_{exc.code}"
                      except (URLError, TimeoutError, OSError) as exc:
                          success = False
                          error = type(exc).__name__
                      elapsed = time.monotonic() - started
                      with lock:
                          state["requests"] += 1
                          state["latency_sum"] += elapsed
                          state["success"] = 1 if success else 0
                          if not success:
                              state["failures"] += 1
                      log("synthetic_check_succeeded" if success else "synthetic_check_failed",
                          request_id=request_id, status=status, latency_seconds=round(elapsed, 4), error=error)
                      time.sleep(interval)

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      return

                  def do_GET(self):
                      if self.path == "/healthz":
                          payload = b'{"status":"ok"}'
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                          return
                      if self.path != "/metrics":
                          self.send_response(404)
                          self.end_headers()
                          return
                      with lock:
                          lines = [
                              "# HELP checkout_synthetic_requests_total Total synthetic checkout checks.",
                              "# TYPE checkout_synthetic_requests_total counter",
                              f'checkout_synthetic_requests_total{{target_service="{target_service}",environment="{environment}"}} {state["requests"]}',
                              "# HELP checkout_synthetic_failures_total Total failed synthetic checkout checks.",
                              "# TYPE checkout_synthetic_failures_total counter",
                              f'checkout_synthetic_failures_total{{target_service="{target_service}",environment="{environment}"}} {state["failures"]}',
                              "# HELP checkout_synthetic_probe_success Latest synthetic checkout result: 1 success, 0 failure.",
                              "# TYPE checkout_synthetic_probe_success gauge",
                              f'checkout_synthetic_probe_success{{target_service="{target_service}",environment="{environment}"}} {state["success"]}',
                              "# HELP checkout_synthetic_request_duration_seconds Total synthetic check latency in seconds.",
                              "# TYPE checkout_synthetic_request_duration_seconds counter",
                              f'checkout_synthetic_request_duration_seconds{{target_service="{target_service}",environment="{environment}"}} {state["latency_sum"]}',
                          ]
                      payload = ("\n".join(lines) + "\n").encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              threading.Thread(target=run_check, daemon=True).start()
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-synthetic-checker
  namespace: demo
  labels:
    app.kubernetes.io/name: checkout-synthetic-checker
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: synthetic-checker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: checkout-synthetic-checker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: checkout-synthetic-checker
  namespace: demo
  labels:
    release: monitoring
    app.kubernetes.io/name: checkout-synthetic-checker
    observability.ai-lab/service: checkout-demo
spec:
  namespaceSelector:
    matchNames:
      - demo
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-synthetic-checker
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
