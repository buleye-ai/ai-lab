apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: checkout-demo
  namespace: demo
  labels:
    release: monitoring
    app.kubernetes.io/name: checkout-demo
    observability.ai-lab/service: checkout-demo
spec:
  namespaceSelector:
    matchNames:
      - demo
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
