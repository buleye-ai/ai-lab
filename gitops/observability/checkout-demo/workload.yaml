apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-demo
  namespace: demo
  labels:
    app.kubernetes.io/name: checkout-demo
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: api
    observability.ai-lab/service: checkout-demo
    observability.ai-lab/team: commerce
    observability.ai-lab/environment: lab
    observability.ai-lab/cluster: k3d-ai-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-demo
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: api
        observability.ai-lab/service: checkout-demo
        observability.ai-lab/team: commerce
        observability.ai-lab/environment: lab
        observability.ai-lab/cluster: k3d-ai-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: diagnostic-agent:dev
          imagePullPolicy: Never
          env:
            - name: LAB_MODE
              value: healthy
            - name: SERVICE_NAME
              value: checkout-demo
            - name: ENVIRONMENT
              value: lab
            - name: REVISION
              value: baseline
          command:
            - python
            - -c
          args:
            - |
              import json
              import os
              import time
              import uuid
              from http.server import BaseHTTPRequestHandler, HTTPServer

              service = os.environ["SERVICE_NAME"]
              environment = os.environ["ENVIRONMENT"]
              revision = os.environ["REVISION"]
              mode = os.environ["LAB_MODE"]
              metrics = {"total": 0, "errors": 0, "latency_sum": 0.0}
              bucket_limits = (0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, float("inf"))
              buckets = {limit: 0 for limit in bucket_limits}

              def log(event, **extra):
                  print(json.dumps({
                      "service": service,
                      "environment": environment,
                      "revision": revision,
                      "event": event,
                      **extra,
                  }, ensure_ascii=False), flush=True)

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      return

                  def send_json(self, status_code, body):
                      payload = json.dumps(body).encode()
                      self.send_response(status_code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

                  def do_GET(self):
                      started = time.monotonic()

                      if self.path == "/healthz":
                          self.send_json(200, {"status": "ok", "service": service})
                          return

                      if self.path == "/metrics":
                          lines = [
                              "# HELP checkout_requests_total Total checkout requests.",
                              "# TYPE checkout_requests_total counter",
                              f'checkout_requests_total{{service="{service}",environment="{environment}",revision="{revision}"}} {metrics["total"]}',
                              "# HELP checkout_errors_total Total failed checkout requests.",
                              "# TYPE checkout_errors_total counter",
                              f'checkout_errors_total{{service="{service}",environment="{environment}",revision="{revision}"}} {metrics["errors"]}',
                              "# HELP checkout_request_duration_seconds Checkout request latency in seconds.",
                              "# TYPE checkout_request_duration_seconds histogram",
                          ]
                          for limit, count in buckets.items():
                              le = "+Inf" if limit == float("inf") else str(limit)
                              lines.append(f'checkout_request_duration_seconds_bucket{{service="{service}",environment="{environment}",revision="{revision}",le="{le}"}} {count}')
                          lines.extend([
                              f'checkout_request_duration_seconds_sum{{service="{service}",environment="{environment}",revision="{revision}"}} {metrics["latency_sum"]}',
                              f'checkout_request_duration_seconds_count{{service="{service}",environment="{environment}",revision="{revision}"}} {metrics["total"]}',
                          ])
                          payload = ("\n".join(lines) + "\n").encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain; version=0.0.4")
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                          return

                      if self.path != "/checkout":
                          self.send_json(404, {"error": "not found"})
                          return

                      request_id = str(uuid.uuid4())
                      elapsed = time.monotonic() - started
                      metrics["total"] += 1
                      metrics["latency_sum"] += elapsed
                      for limit in bucket_limits:
                          if elapsed <= limit:
                              buckets[limit] += 1

                      if mode != "healthy":
                          metrics["errors"] += 1
                          log("checkout_failed", request_id=request_id, reason="lab_mode_not_healthy", lab_mode=mode)
                          self.send_json(503, {"error": "checkout temporarily unavailable", "request_id": request_id})
                          return

                      log("checkout_succeeded", request_id=request_id)
                      self.send_json(200, {"status": "accepted", "request_id": request_id, "revision": revision})

              log("application_started", lab_mode=mode)
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
