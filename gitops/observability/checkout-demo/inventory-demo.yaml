apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-demo
  namespace: demo
  labels:
    app.kubernetes.io/name: inventory-demo
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: dependency
    observability.ai-lab/service: inventory-demo
    observability.ai-lab/team: commerce
    observability.ai-lab/environment: lab
    observability.ai-lab/cluster: k3d-ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-demo
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: dependency
        observability.ai-lab/service: inventory-demo
        observability.ai-lab/team: commerce
        observability.ai-lab/environment: lab
        observability.ai-lab/cluster: k3d-ai-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: checkout-demo-tracing:dev
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=inventory-demo,deployment.environment=lab,service.version=baseline,k8s.namespace.name=demo,k8s.cluster.name=k3d-ai-lab
            - name: LAB_MODE
              value: unhealthy
            - name: SERVICE_NAME
              value: inventory-demo
            - name: ENVIRONMENT
              value: lab
            - name: REVISION
              value: downstream-incident-2026-08-22-01
          command:
            - python
            - -c
          args:
            - |
              import json
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              from opentelemetry.trace import Status, StatusCode
              from tracing_utils import checkout_trace_log_fields, start_inventory_span

              service = os.environ["SERVICE_NAME"]
              environment = os.environ["ENVIRONMENT"]
              revision = os.environ["REVISION"]
              mode = os.environ["LAB_MODE"]

              def log(event, **extra):
                  print(json.dumps({
                      "service": service,
                      "environment": environment,
                      "revision": revision,
                      "event": event,
                      **extra,
                  }, ensure_ascii=False), flush=True)

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      return

                  def send_json(self, status_code, body):
                      payload = json.dumps(body).encode()
                      self.send_response(status_code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

                  def do_GET(self):
                      if self.path == "/healthz":
                          self.send_json(200, {"status": "ok", "service": service})
                          return
                      if self.path != "/reserve":
                          self.send_json(404, {"error": "not found"})
                          return

                      with start_inventory_span(self.headers.get("traceparent")) as span:
                          trace_fields = checkout_trace_log_fields(span)
                          if mode != "healthy":
                              span.set_attribute("http.response.status_code", 503)
                              span.set_status(Status(StatusCode.ERROR, "lab_mode_not_healthy"))
                              log("inventory_reserve_failed", reason="lab_mode_not_healthy", lab_mode=mode, **trace_fields)
                              self.send_json(503, {"error": "inventory temporarily unavailable"})
                              return

                          span.set_attribute("http.response.status_code", 200)
                          span.set_status(Status(StatusCode.OK))
                          log("inventory_reserved", **trace_fields)
                          self.send_json(200, {"status": "reserved", "revision": revision})

              log("application_started", lab_mode=mode)
              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-demo
  namespace: demo
  labels:
    app.kubernetes.io/name: inventory-demo
    app.kubernetes.io/part-of: ai-lab
    observability.ai-lab/service: inventory-demo
    observability.ai-lab/team: commerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
