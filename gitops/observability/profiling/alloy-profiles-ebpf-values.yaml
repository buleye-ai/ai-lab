# Isolated node-level eBPF profiler for the lab. It does not share the logs/events Alloy.
# SECURITY: pyroscope.ebpf requires root + hostPID + privileged. Target filtering
# limits exported profiles; it does not remove host-level process visibility.
fullnameOverride: alloy-profiles-ebpf

crds:
  create: false

controller:
  type: daemonset
  hostPID: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  # Constrain this PoC to the one selected worker, not every Lab node.
  nodeSelector:
    kubernetes.io/hostname: k3d-ai-lab-agent-0
  volumes:
    extra:
      # The only writable state for Alloy while its root FS remains read-only.
      - name: alloy-runtime
        emptyDir: {}
      # pyroscope.ebpf keeps symbol cache under /tmp/symb-cache in Alloy 1.18.
      - name: alloy-tmp
        emptyDir: {}

global:
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: Unconfined

serviceAccount:
  create: true
  automountServiceAccountToken: true

# Scoped, read-only workload discovery. No ClusterRole/ClusterRoleBinding, logs,
# events, nodes, secrets, or Kubernetes mutation privileges.
rbac:
  create: true
  namespaces:
    - demo
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
  clusterRules: []

alloy:
  stabilityLevel: generally-available
  enableReporting: false
  extraEnv:
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  # Root FS remains immutable; write runtime/remotecfg state only to this emptyDir.
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: alloy-runtime
        mountPath: /var/lib/alloy
      - name: alloy-tmp
        mountPath: /tmp
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    create: true
    content: |-
      discovery.kubernetes "local_pods" {
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + env("MY_NODE_NAME")
        }
        role = "pod"
      }

      discovery.relabel "profile_targets" {
        targets = discovery.kubernetes.local_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "demo"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(checkout-demo|inventory-demo)"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_observability_ai_lab_environment"]
          target_label  = "environment"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      pyroscope.ebpf "lab" {
        targets    = discovery.relabel.profile_targets.output
        forward_to = [pyroscope.write.lab.receiver]
      }

      pyroscope.write "lab" {
        endpoint {
          url = "http://pyroscope.observability.svc.cluster.local:4040"
        }
      }
