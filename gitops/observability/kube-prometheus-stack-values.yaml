alertmanager:
  enabled: false

grafana:
  # Keep credentials outside Helm rendering so Argo CD does not generate a
  # different random admin password on every comparison.
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.localhost
    path: /
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

# These control-plane endpoints are not exposed in the default k3s setup.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
