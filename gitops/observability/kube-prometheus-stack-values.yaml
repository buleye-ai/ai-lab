alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 1m
    route:
      receiver: "null"
      group_by:
        - alertname
        - namespace
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - receiver: local-webhook
          matchers:
            - alertname =~ "AiLabAlertPipelineTest|PodCrashLooping"
    receivers:
      - name: "null"
      - name: local-webhook
        webhook_configs:
          - url: http://alert-webhook.observability.svc.cluster.local:8080/alerts
            send_resolved: true
          - url: http://diagnostic-agent.ai-system.svc.cluster.local:8080/api/v1/alerts
            send_resolved: true
          # Local debugging endpoint on the OrbStack macOS host.
          - url: http://host.docker.internal:18080/alerts
            send_resolved: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.localhost
    paths:
      - /
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  # Keep credentials outside Helm rendering so Argo CD does not generate a
  # different random admin password on every comparison.
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.localhost
    path: /
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false

prometheus:
  # Prometheus UI：仅通过本机 k3d 的 Traefik 入口访问（localhost:8080/8443），
  # 不暴露 NodePort 或宿主机局域网端口。
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.localhost
    paths:
      - /
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

# These control-plane endpoints are not exposed in the default k3s setup.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
