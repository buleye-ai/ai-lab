alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 1m
    route:
      receiver: "null"
      group_by:
        - alertname
        - namespace
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        # Existing learning alerts retain their current three-destination route.
        - receiver: local-webhook
          matchers:
            - alertname =~ "AiLabAlertPipelineTest|PodCrashLooping"

        # checkout-demo is isolated to the local receiver and never reaches the
        # legacy alert-webhook or diagnostic-agent destinations.
        - receiver: lab-critical-webhook
          matchers:
            - environment = "lab"
            - cluster = "k3d-ai-lab"
            - service = "checkout-demo"
            - severity = "critical"
          group_by: [alertname, cluster, environment, namespace, service]
          group_wait: 5s
          group_interval: 30s
          repeat_interval: 2m
        - receiver: lab-warning-webhook
          matchers:
            - environment = "lab"
            - cluster = "k3d-ai-lab"
            - service = "checkout-demo"
            - severity = "warning"
          group_by: [alertname, cluster, environment, namespace, service]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 5m
        - receiver: lab-ticket-webhook
          matchers:
            - environment = "lab"
            - cluster = "k3d-ai-lab"
            - service = "checkout-demo"
            - severity = "ticket"
          group_by: [alertname, cluster, environment, namespace, service]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 30m
        - receiver: lab-info-webhook
          matchers:
            - environment = "lab"
            - cluster = "k3d-ai-lab"
            - service = "checkout-demo"
            - severity = "info"
          group_by: [alertname, cluster, environment, namespace, service]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
    inhibit_rules:
      # A user-impacting critical alert suppresses lower-level symptoms only for
      # this lab service and the same cluster/environment/namespace/service.
      - source_matchers:
          - environment = "lab"
          - cluster = "k3d-ai-lab"
          - service = "checkout-demo"
          - severity = "critical"
        target_matchers:
          - environment = "lab"
          - cluster = "k3d-ai-lab"
          - service = "checkout-demo"
          - severity = "warning"
        equal:
          - cluster
          - environment
          - namespace
          - service
    receivers:
      - name: "null"
      - name: local-webhook
        webhook_configs:
          - url: http://alert-webhook.observability.svc.cluster.local:8080/alerts
            send_resolved: true
          - url: http://diagnostic-agent.ai-system.svc.cluster.local:8080/api/v1/alerts
            send_resolved: true
          # Local debugging endpoint on the OrbStack macOS host.
          - url: http://host.docker.internal:18080/alerts
            send_resolved: true
      - name: lab-critical-webhook
        webhook_configs:
          - url: http://host.docker.internal:18080/alerts/critical
            send_resolved: true
      - name: lab-warning-webhook
        webhook_configs:
          - url: http://host.docker.internal:18080/alerts/warning
            send_resolved: true
      - name: lab-ticket-webhook
        webhook_configs:
          - url: http://host.docker.internal:18080/alerts/ticket
            send_resolved: true
      - name: lab-info-webhook
        webhook_configs:
          - url: http://host.docker.internal:18080/alerts/info
            send_resolved: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.localhost
    paths:
      - /
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  # Keep credentials outside Helm rendering so Argo CD does not generate a
  # different random admin password on every comparison.
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.localhost
    path: /
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  additionalDataSources:
    - name: Tempo (Trace Lab)
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      uid: tempo-trace-lab
      isDefault: false
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false

prometheus:
  # Prometheus UI：仅通过本机 k3d 的 Traefik 入口访问（localhost:8080/8443），
  # 不暴露 NodePort 或宿主机局域网端口。
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.localhost
    paths:
      - /
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

# These control-plane endpoints are not exposed in the default k3s setup.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
