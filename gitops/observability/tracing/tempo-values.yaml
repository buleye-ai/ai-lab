# Minimal Tempo backend for the checkout-demo Trace Lab.
# Scope: one single-binary instance, 24h local retention, no external ingress.
# This is intentionally not a production HA / multi-tenant deployment.
replicas: 1

# Pin the application image independently from the Helm chart.
tempo:
  tag: "2.9.0"
  pullPolicy: IfNotPresent
  multitenancyEnabled: false
  reportingEnabled: false
  retention: 24h
  metricsGenerator:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # Accept only OTLP/HTTP from the in-cluster Collector. Jaeger, Zipkin and
  # OpenCensus receivers stay disabled to keep the Lab network surface minimal.
  # Kept solely for the Helm Service template; the real runtime config below
  # deliberately omits legacy receivers so Tempo never starts them.
  receivers:
    jaeger:
      protocols:
        grpc:
          endpoint: ""
        thrift_binary:
          endpoint: ""
        thrift_compact:
          endpoint: ""
        thrift_http:
          endpoint: ""
    opencensus: null
    otlp:
      protocols:
        grpc:
          endpoint: ""
        http:
          endpoint: 0.0.0.0:4318

# The chart's generated config includes any placeholders above. Override it so
# Tempo itself binds only API :3200 and OTLP/HTTP :4318.
config: |
  memberlist:
    cluster_label: "tempo.observability"
  multitenancy_enabled: false
  usage_report:
    reporting_enabled: false
  compactor:
    compaction:
      block_retention: 24h
  distributor:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
  ingester: {}
  server:
    http_listen_port: 3200
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  querier: {}
  query_frontend: {}
  overrides:
    defaults: {}
    per_tenant_override_config: /conf/overrides.yaml

service:
  type: ClusterIP

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 5Gi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
