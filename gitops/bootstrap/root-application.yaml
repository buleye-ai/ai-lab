apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/buleye-ai/ai-lab.git
    targetRevision: main
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

