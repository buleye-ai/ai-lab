apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-agent
  namespace: ai-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diagnostic-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnostic-agent
    spec:
      serviceAccountName: diagnostic-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: diagnostic-agent:dev
          imagePullPolicy: Never
          env:
            - name: ALLOWED_NAMESPACES
              value: demo,observability
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki-gateway.observability.svc.cluster.local
            - name: QUERY_TIMEOUT_SECONDS
              value: "5"
            - name: LOG_LOOKBACK_SECONDS
              value: "600"
            - name: LOG_LIMIT
              value: "50"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-agent
  namespace: ai-system
spec:
  selector:
    app.kubernetes.io/name: diagnostic-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
