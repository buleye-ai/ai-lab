apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.19.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/gitops/observability/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/buleye-ai/ai-lab.git
      targetRevision: main
      ref: values
    # Grafana sidecar provisions only ConfigMaps carrying grafana_dashboard=1.
    # Keep dashboard JSON in Git and sync it through this Application rather
    # than saving unreviewed UI state as the source of truth.
    - repoURL: https://github.com/buleye-ai/ai-lab.git
      targetRevision: main
      path: gitops/observability/grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
