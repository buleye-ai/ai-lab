# Step 1: Pyroscope backend only. The eBPF Alloy source is intentionally added
# only after backend readiness/PVC verification in a separate audited commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: profiling-lab
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-lab
    observability.ai-lab/environment: lab
    observability.ai-lab/risk: privileged-node-profiler
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: pyroscope
      targetRevision: 2.2.1
      helm:
        releaseName: pyroscope
        valueFiles:
          - $values/gitops/observability/profiling/pyroscope-values.yaml
    # Step 2 starts only after Pyroscope 2.2.1 is Synced/Healthy with its 5Gi PVC Bound.
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.11.0
      helm:
        releaseName: alloy-profiles-ebpf
        valueFiles:
          - $values/gitops/observability/profiling/alloy-profiles-ebpf-values.yaml
    - repoURL: https://github.com/buleye-ai/ai-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  # GitOps automation is enabled only after this backend-only source passed
  # local render and server dry-run. The privileged eBPF source remains absent.
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
